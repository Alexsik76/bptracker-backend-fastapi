# Test deployment configuration for Portainer stack (branch dev).
# Mirrors compose.prod.yaml with distinct container names and host ports.

services:
  db:
    image: postgres:18
    container_name: bptracker-fa-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "${POSTGRES_HOST_PORT:-5438}:5432"
    volumes:
      - bp_fa_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: bptracker-backend-dev-api
    pull_policy: never
    container_name: bptracker-fa-api-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_HOST_PORT:-8002}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      MAGIC_LINK_BASE_URL: ${MAGIC_LINK_BASE_URL:?MAGIC_LINK_BASE_URL is required}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WEBAUTHN_RP_ID is required}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:?WEBAUTHN_ORIGINS is required}
      EXPORT_SHEETS_TEMPLATE_URL: ${EXPORT_SHEETS_TEMPLATE_URL:?EXPORT_SHEETS_TEMPLATE_URL is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?ALLOWED_EMAILS is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}

      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-True}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
      MAGIC_LINK_TTL_MINUTES: ${MAGIC_LINK_TTL_MINUTES:-15}
      MAGIC_LINK_TOKEN_BYTES: ${MAGIC_LINK_TOKEN_BYTES:-32}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-BP Tracker}
      WEBAUTHN_CHALLENGE_TTL_MINUTES: ${WEBAUTHN_CHALLENGE_TTL_MINUTES:-5}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_MENU_MODEL: ${GEMINI_MENU_MODEL:-gemini-2.0-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      ANALYZE_MAX_FILE_BYTES: ${ANALYZE_MAX_FILE_BYTES:-10485760}
      MENU_HISTORY_DAYS: ${MENU_HISTORY_DAYS:-3}
      LLM_EXCHANGE_LOG: ${LLM_EXCHANGE_LOG:-True}

volumes:
  bp_fa_pgdata:
